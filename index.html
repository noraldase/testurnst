```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Turnstile Test</title>

    <script
        src="https://challenges.cloudflare.com/turnstile/v0/api.js"
        async
        defer>
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
        }

        .card {
            width: min(420px, calc(100% - 32px));
            padding: 32px;
            border-radius: 16px;
            background: #1f2937;
            box-shadow: 0 20px 50px rgba(0,0,0,.35);
        }

        h1 {
            margin-top: 0;
            font-size: 24px;
        }

        p {
            color: #9ca3af;
            line-height: 1.5;
        }

        .turnstile-container {
            margin: 24px 0;
            min-height: 70px;
        }

        button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 10px;
            background: #2563eb;
            color: white;
            font-size: 15px;
            cursor: pointer;
        }

        button:disabled {
            opacity: .5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 18px;
            padding: 12px;
            border-radius: 8px;
            background: #111827;
            font-size: 14px;
            word-break: break-word;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Turnstile Test</h1>

    <p>
        Halaman ini digunakan untuk menguji deteksi Turnstile
        menggunakan browser/VNC.
    </p>

    <form id="test-form">

        <div
            class="cf-turnstile"
            data-sitekey="3x00000000000000000000FF"
            data-callback="turnstileSuccess"
            data-error-callback="turnstileError"
            data-expired-callback="turnstileExpired">
        </div>

        <button id="submitBtn" type="submit" disabled>
            Submit
        </button>

    </form>

    <div id="status">
        Status: menunggu Turnstile...
    </div>

</div>

<script>

let turnstileToken = null;

function setStatus(message) {
    document.getElementById("status").textContent =
        "Status: " + message;
}

function turnstileSuccess(token) {

    turnstileToken = token;

    document.getElementById("submitBtn").disabled = false;

    setStatus("TURNSTILE PASSED");
    
    console.log("Turnstile success");
    console.log("Token received:", token);
}

function turnstileError() {

    turnstileToken = null;

    document.getElementById("submitBtn").disabled = true;

    setStatus("TURNSTILE ERROR");

    console.log("Turnstile error");
}

function turnstileExpired() {

    turnstileToken = null;

    document.getElementById("submitBtn").disabled = true;

    setStatus("TURNSTILE EXPIRED");

    console.log("Turnstile expired");
}

document
    .getElementById("test-form")
    .addEventListener("submit", function(event) {

        event.preventDefault();

        if (!turnstileToken) {
            setStatus("Turnstile belum selesai");
            return;
        }

        setStatus("FORM SUBMITTED");

        console.log("Form submitted successfully");
    });

</script>

</body>
</html>
```
